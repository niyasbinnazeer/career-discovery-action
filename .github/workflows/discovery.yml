name: Career Discovery

on:
  # Runs every 2 hours. GitHub cron is best-effort and may delay 5-30 min under
  # load — fine for job discovery. Change the expression to run more often.
  schedule:
    - cron: "0 */2 * * *"
  # Manual trigger button in the Actions tab — useful for testing or draining
  # the backlog on demand.
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    # GitHub free tier allows 6h per job; we'll finish in 2-5 min.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CAREER_ANALYZER_URL: ${{ secrets.CAREER_ANALYZER_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node discovery.mjs
